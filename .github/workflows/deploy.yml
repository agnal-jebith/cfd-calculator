name: Deploy CFD Calculator to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch (e.g., master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push to gh-pages branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a version compatible with your project
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build PWA
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Directory containing the build output
          # user_name: 'github-actions[bot]' # Optional: Custom commit user
          # user_email: 'github-actions[bot]@users.noreply.github.com' # Optional: Custom commit email